name: Kontrola źródeł

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: php tools/check.php
      - run: node --check assets/admin.js
      - run: node --check assets/directory.js
      - run: node --check assets/filter-controls.js
      - run: node --check assets/method-icons-admin.js
      - run: node --check assets/location-picker.js
      - run: php tools/package.php
